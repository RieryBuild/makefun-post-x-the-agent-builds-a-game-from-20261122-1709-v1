<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIZZA RUN — one prompt, one game</title>
<style>
  html,body{margin:0;padding:0;background:#191419;height:100%;display:flex;align-items:center;justify-content:center;font-family:'DejaVu Sans',sans-serif}
  #wrap{position:relative;width:960px;height:640px}
  canvas{display:block;width:960px;height:640px;border-radius:12px;box-shadow:0 0 0 6px #e4572e,0 18px 50px rgba(0,0,0,.6)}
  #hint{position:absolute;left:0;right:0;bottom:-34px;text-align:center;color:#fff3d6;font-size:15px;opacity:.85}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="960" height="640"></canvas>
  <div id="hint">PIZZA RUN &middot; Arrow keys / WASD to drive &middot; deliver 3 pizzas before they go cold</div>
</div>
<script src="game.js"></script>
</body>
</html>
